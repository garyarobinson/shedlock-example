spring:
  application:
    name: database-cleanup-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/cleanup_db
    username: cleanup_user
    password: cleanup_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    default-schema: public
    create-schemas: true

  # Scheduling configuration
  task:
    scheduling:
      pool:
        size: 5

# Logging configuration
logging:
  level:
    com.example.cleanupservice: INFO
    net.javacrumbs.shedlock: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

# Custom application properties
cleanup:
  # Retention periods in days
  audit-log-retention-days: 90
  app-version-retention-days: 90
  
  # Scheduling
  scheduled:
    audit-cleanup-cron: "0 */1 * * * ?" # Default: Every 1 minute
    app-version-cleanup-cron: "0 */2 * * * ?" # Default: Every 2 minutes

